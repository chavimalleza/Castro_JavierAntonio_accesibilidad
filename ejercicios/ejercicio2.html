<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Pets</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
    <style>
        body { font-family: Lexend, sans-serif; font-size: 16px; margin: 0; background-color: #e4f3c7; color: #222; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; background-color: #727c60; padding: 20px; }
        header img { width: 100px; height: auto; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; }
        nav a { text-decoration: none; color: #000; padding: 10px 15px; border-radius: 5px; }
        nav a:hover, nav a:focus { background-color: #fff; color: #000; }
        .container { max-width: 700px; width: calc(100% - 2rem); margin: 1.5rem auto; }
        h1 { text-align: center; font-size: 2.5rem; color: #222; }
        form { max-width: 500px; margin: 0 auto; padding: 20px; background-color: #fff; border: 1px solid #777; border-radius: 5px; }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #555; border-radius: 3px; margin-bottom: 8px; font: inherit; }
        fieldset { margin: 0 0 1rem; padding: 12px; border: 1px solid #777; }
        legend { font-weight: bold; }
        .radio-option { display: inline-flex; align-items: center; gap: 0.4rem; margin: 0 1rem 0 0; }
        .radio-option label { display: inline; margin: 0; }
        input[type="submit"] { background-color: #245b27; color: #fff; padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; font: inherit; }
        input[type="submit"]:hover, input[type="submit"]:focus { background-color: #173d1a; }
        :focus-visible { outline: 3px solid #174ea6; outline-offset: 2px; }
    </style>
</head>
<body>
    <header>
        <img src="./img/logo.jpeg" alt="Logotipo de Pets">
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Contacto</h1>
        <!-- WCAG 3.3.2: cada campo debe tener una etiqueta visible y asociada programáticamente. -->
        <form action="#" method="post">
            <div class="field">
                <label for="first-name">Nombre:</label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
            </div>
            <div class="field">
                <label for="last-name">Apellidos:</label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
            </div>
            <!-- WCAG 1.3.1 y 4.1.2: fieldset y legend agrupan las opciones de radio con un nombre común. -->
            <fieldset>
                <legend>Género</legend>
                <div class="radio-option">
                    <input type="radio" name="gender" value="Hombre" id="gender-male">
                    <label for="gender-male">Hombre</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="gender" value="Mujer" id="gender-female">
                    <label for="gender-female">Mujer</label>
                </div>
            </fieldset>
            <!-- La relación for/id permite que la etiqueta nombre el desplegable también para lectores de pantalla. -->
            <div class="field">
                <label for="favorite-animal">Animal favorito:</label>
                <select id="favorite-animal" name="favorite-animal">
                    <option value="">Selecciona una opción</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                    <option value="Pez">Pez</option>
                </select>
            </div>
            <!-- El valor visible proporciona un nombre accesible al botón de envío. -->
            <input type="submit" value="Enviar">
        </form>
    </main>
</body>
</html>
